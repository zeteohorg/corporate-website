<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, minimum-scale=1.0, maximum-scale=5.0"
		/>
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />

		<!-- PWA manifest -->
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- Favicon -->
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- Noto Sans JP web font — injected by hooks.server.ts on Japanese pages
		     only. English pages render Latin text with system fonts (Noto Sans JP
		     is a fallback for JP glyphs) and don't download any of it, so loading
		     the ~30 KiB CJK font CSS + its origins there is pure waste. -->
		%fonthead%

		<!-- Plausible Analytics -->
		<script>
			window.plausible =
				window.plausible ||
				function () {
					(window.plausible.q = window.plausible.q || []).push(arguments);
				};
		</script>
		<script
			defer
			data-domain="zeteoh.com"
			src="https://plausible.zeteoh.com/js/script.outbound-links.js"
		></script>

		<!-- Prevent FOUC: apply dark class before any content renders -->
		<script>
			(() => {
				const theme =
					localStorage.getItem('theme') ||
					(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				if (theme === 'dark') document.documentElement.classList.add('dark');
			})();
		</script>

		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-background min-h-screen font-sans antialiased"
	>
		<div style="display: contents">%sveltekit.body%</div>

		<!-- Netlify Forms detection (hidden): durable fallback lead sink for the
		     Solution Finder if the HubSpot forward fails. The live form is
		     client-rendered, so Netlify needs this static markup to register the
		     field set at build time. -->
		<form name="solution-finder" data-netlify="true" netlify-honeypot="bot-field" hidden>
			<input type="text" name="email" />
			<input type="text" name="name" />
			<input type="text" name="phone" />
			<input type="text" name="company" />
			<input type="text" name="sf_vertical" />
			<input type="text" name="sf_area_band" />
			<input type="text" name="sf_headcount_band" />
			<input type="text" name="sf_accuracy_need" />
			<input type="text" name="sf_constraints" />
			<input type="text" name="sf_device_availability" />
			<input type="text" name="sf_timeline" />
			<input type="text" name="sf_budget_band" />
			<input type="text" name="sf_recommended_tech" />
			<input type="text" name="sf_department_title" />
			<input type="text" name="sf_lang" />
		</form>
	</body>
</html>
